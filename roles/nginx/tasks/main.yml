---
- name: Install nginx
  apt:
    name: nginx
    state: present
    update_cache: yes

- name: Remove default nginx site
  file:
    path: /etc/nginx/sites-enabled/default
    state: absent

- name: Copy nginx reverse proxy config
  template:
    src: devops-apps.conf.j2
    dest: /etc/nginx/sites-available/devops-apps
    owner: root
    group: root
    mode: '0644'

- name: Enable devops nginx site
  file:
    src: /etc/nginx/sites-available/devops-apps
    dest: /etc/nginx/sites-enabled/devops-apps
    state: link

- name: Test nginx config
  command: nginx -t
  changed_when: false

- name: Restart nginx
  systemd:
    name: nginx
    state: restarted
    enabled: yes
